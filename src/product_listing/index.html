<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Products</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="/js/product-listing.js"></script>
  </head>

  <body>
    <header id="main-header" class="divider"></header>
    <main class="divider">
      <section class="products">
        <div class="product-listing__controls">
          <h2 class="product-listing__title">Top Products</h2>
          <label for="sort-select" class="visually-hidden">Sort by</label>
          <select id="sort-select" class="sort-select">
            <option value="default">Sort by: Default</option>
            <option value="asc">Price: Low to High</option>
            <option value="desc">Price: High to Low</option>
          </select>
        </div>
        <ul class="product-list"></ul>
      </section>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
